name: openwrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:             
      OP_IP:
        description: '静态IP地址'     
        required: false
        default: '192.168.2.1' 
        type: string
      OP_author:
        description: '定制作者'     
        required: false
        default: 'kubulama' 
        type: string    
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-app-socat luci-app-samba4 luci-theme-m3e luci-app-ttyd luci-app-diskman'
        type: string

permissions:
  contents: write

env:
  DIY_P1_SH: sh/op.sh

jobs:
  build_firmware:
    name: 编译固件 - ${{ matrix.device }} - ${{ matrix.source }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: ["xr30-nand"]
        source: ["openwrt"]
        include:
          - device: "xr30-nand"
            config: |
              CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_xr30-nand=y

    steps: 
    - name: 检查分支
      uses: actions/checkout@v6

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: Restore apt cache
      uses: actions/cache/restore@v5
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: apt-cache-ubuntu-22.04
        restore-keys: |
          apt-cache-

    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Asia/Shanghai
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
        sudo dpkg-reconfigure -f noninteractive tzdata
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget patch autoconf automake curl binutils bzip2 lib32gcc-s1 libc6-dev-i386 libreadline-dev libglib2.0-dev libelf-dev libtool autopoint gperf ccache swig coreutils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: Save apt cache
      if: success()
      uses: actions/cache/save@v5
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: apt-cache-ubuntu-22.04

    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d')"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "OP_author=${{ github.event.inputs.OP_author }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        echo "DEVICE_NAME=${{ matrix.device }}" >> $GITHUB_ENV
        echo "SOURCE_NAME=${{ matrix.source }}" >> $GITHUB_ENV
        echo "REPO_URL=https://github.com/shiyu1314/openwrt-source" >> $GITHUB_ENV
        echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
        echo "CCACHE_DIR=/workdir/.ccache" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        case $REPO_BRANCH in
          openwrt-25.12)
            _release_tag=$(git ls-remote --tags $REPO_URL 'v25.*' | grep -v '\^{}' | awk -F/ '{print $NF}' | sort -V | tail -1)
            ;;
          *)
            echo "Can't get local/upstream's branch/tags"
            ;;
        esac
        git clone --depth=1 --branch=$_release_tag $REPO_URL $SOURCE_NAME
        ln -sf /workdir/$SOURCE_NAME $GITHUB_WORKSPACE/$SOURCE_NAME
        echo "release_tag=$_release_tag" >> $GITHUB_ENV
        
    - name: 取回缓存 staging_dir
      id: build-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          /workdir/.ccache
          ${{ matrix.source }}/dl
          ${{ matrix.source }}/staging_dir
          ${{ matrix.source }}/build_dir/host
          ${{ matrix.source }}/build_dir/hostpkg
          ${{ matrix.source }}/build_dir/toolchain-*
          ${{ matrix.source }}/bin/packages
        key: ${{ matrix.source }}-${{ matrix.device }}-build-cache-${{ env.release_tag }}
        restore-keys: |
          ${{ matrix.source }}-${{ matrix.device }}-build-cache-

    - name: Validate toolchain cache
      run: |
        cd $SOURCE_NAME
        if [ -d staging_dir ] && ! find staging_dir -path '*/toolchain-*/lib/libgcc_s.so.*' | grep -q .; then
          echo "::warning::Restored toolchain cache is incomplete; rebuilding toolchain only."
          rm -rf staging_dir/toolchain-* build_dir/toolchain-* build_dir/target-*/toolchain
          rm -f staging_dir/target-*/pkginfo/toolchain.* staging_dir/target-*/stamp/.toolchain_installed
        fi
    - name: Restore feeds cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ matrix.source }}/feeds
          ${{ matrix.source }}/package/feeds
        key: ${{ matrix.source }}-${{ matrix.device }}-feeds-${{ env.release_tag }}
        restore-keys: |
          ${{ matrix.source }}-${{ matrix.device }}-feeds-

    - name: patch修补
      run: |
        set -x
        cd $SOURCE_NAME
        [ -d ./staging_dir ] && find ./staging_dir/ -type f -print0 | xargs -0 -r touch >/dev/null 2>&1 || true
        ./scripts/feeds update -a
        cd .. 
        [ -e patch ] && cp -rf patch/diy/*.patch $SOURCE_NAME
        [ -e patch ] && cp -rf patch/luci/*.patch $SOURCE_NAME/feeds/luci
        
    - name: 加载自定义脚本
      run: |
        chmod +x $DIY_P1_SH
        cd $SOURCE_NAME
        $GITHUB_WORKSPACE/$DIY_P1_SH
        cd ..
        [ -e patch ] && cp -rf patch/nginx/luci.locations $SOURCE_NAME/feeds/packages/net/nginx/files-luci-support
        [ -e patch ] && cp -rf patch/nginx/uci.conf.template $SOURCE_NAME/feeds/packages/net/nginx-util/files

    - name: Save feeds cache
      if: success()
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ matrix.source }}/feeds
          ${{ matrix.source }}/package/feeds
        key: ${{ matrix.source }}-${{ matrix.device }}-feeds-${{ env.release_tag }}

    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files $SOURCE_NAME/files
        cat <<EOF >>$SOURCE_NAME/.config
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_CCACHE=y
        ${{ matrix.config }}
        EOF
        
        [ -e config ] && cat config/config-common >> $SOURCE_NAME/.config
        
        sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" $SOURCE_NAME/package/base-files/files/bin/config_generate
        
        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> $SOURCE_NAME/.config
        done
    
    - name: 下载编译依赖
      id: package
      run: |
        cd $SOURCE_NAME
        rm -rf bin/targets
        make defconfig
        grep -E 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config || true
        for i in 1 2 3; do
          make download -j16 && break
          echo "::warning::make download failed, retrying ($i/3)..."
          sleep 10
        done
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译源码
      id: compile
      run: |
        cd $SOURCE_NAME
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || yes n | make -j1 || yes n | make -j1 V=s

    - name: Save build cache
      if: success()
      uses: actions/cache/save@v5
      with:
        path: |
          /workdir/.ccache
          ${{ matrix.source }}/dl
          ${{ matrix.source }}/staging_dir
          ${{ matrix.source }}/build_dir/host
          ${{ matrix.source }}/build_dir/hostpkg
          ${{ matrix.source }}/build_dir/toolchain-*
          ${{ matrix.source }}/bin/packages
        key: ${{ matrix.source }}-${{ matrix.device }}-build-cache-${{ env.release_tag }}

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        cd $SOURCE_NAME/bin/targets/*/*
        mkdir -p /tmp/firmware
        cp -f *sysupgrade.bin /tmp/firmware/ 2>/dev/null || true
        rm -rf ./*
        cp -f /tmp/firmware/*sysupgrade.bin .
        rm -rf /tmp/firmware
        ls -lh
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}-${{env.tag}}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ====================固件信息=======================
          分支：${{ env.release_tag }}
          静态IP：${{ github.event.inputs.OP_IP }}
          插件：${{ github.event.inputs.CUSTOM_PLUGINS }}
          定制作者：${{ github.event.inputs.OP_author }}
          默认密码：无

    - name: 清理Releases
      uses: gzk47/delete-older-releases@v0.3.5
      with:
        keep_latest: 1
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
