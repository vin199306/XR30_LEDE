name: Build FFmpeg for OpenWrt (mt7981 / aarch64_cortex-a53)

# ============================================================================
# 交叉编译 FFmpeg 二进制程序，适用于 mt7981 (MediaTek Filogic 820) 处理器
# 架构: aarch64_cortex-a53 (ARM Cortex-A53)
# 目标平台: OpenWrt mediatek/filogic 子目标
# 使用 OpenWrt 官方 SDK 提供的工具链进行交叉编译
# 产物: ffmpeg / ffprobe 可直接在目标设备上运行
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg 版本 (tag/branch)'
        required: true
        default: 'n7.1.1'
      build_type:
        description: '构建类型 (static=静态链接 / shared=动态链接)'
        type: choice
        options:
          - static
          - shared
        default: static
      enable_gpl:
        description: '启用 GPL 编解码器 (x264 / x265 等)'
        type: boolean
        default: true
      optimize_size:
        description: '体积优化 (small + hardcoded-tables + lto)'
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cross-compile-ffmpeg-aarch64.yml'

# 环境常量 — OpenWrt SDK 版本与 mt7981 目标架构配置
env:
  OPENWRT_VERSION: '24.10.2'
  TARGET: 'mediatek'          # OpenWrt target (mt7981 属于 mediatek 平台)
  SUBTARGET: 'filogic'         # OpenWrt subtarget (Filogic 系列: mt7981/mt7986)
  ARCH: 'aarch64_cortex-a53'  # 包架构名 (staging_dir 目录名使用)
  GCC_VERSION: '13.3.0'       # SDK 内 GCC 版本
  CPU: 'cortex-a53'           # mt7981 核心为 ARM Cortex-A53

permissions:
  contents: read

# 同一时间只允许一个构建运行
concurrency:
  group: ffmpeg-openwrt-mt7981-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 将 workflow_dispatch 输入转换为环境变量，兼容 push 触发时的默认值
    env:
      FFMPEG_VERSION: ${{ github.event.inputs.ffmpeg_version || 'n7.1.1' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'static' }}
      ENABLE_GPL: ${{ github.event.inputs.enable_gpl || 'true' }}
      OPTIMIZE_SIZE: ${{ github.event.inputs.optimize_size || 'true' }}

    steps:
      # ======================================================================
      # 步骤 1: 安装构建依赖 (环境准备)
      # ======================================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            nasm \
            yasm \
            zstd \
            file \
            cmake

      # ======================================================================
      # 步骤 2: 缓存 OpenWrt SDK (加速后续构建)
      # ======================================================================
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: openwrt-sdk
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-v1

      # ======================================================================
      # 步骤 3: 下载并解压 OpenWrt SDK (含 aarch64_cortex-a53 交叉工具链)
      # ======================================================================
      - name: Download and extract OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/openwrt-sdk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}_gcc-${GCC_VERSION}_musl.Linux-x86_64.tar.zst"
          echo "Downloading SDK: $URL"
          curl -fSL --retry 3 -o sdk.tar.zst "$URL"

          mkdir -p openwrt-sdk
          tar --zstd -xf sdk.tar.zst -C openwrt-sdk --strip-components=1
          rm sdk.tar.zst

          echo "SDK extracted. staging_dir contents:"
          ls -la openwrt-sdk/staging_dir/

      # ======================================================================
      # 步骤 4: 配置交叉编译环境 (工具链路径、PATH、pkg-config)
      # ======================================================================
      - name: Setup cross-compile environment
        run: |
          set -e
          SDK_DIR="$(pwd)/openwrt-sdk"

          # 定位工具链目录 (使用 glob 匹配，兼容不同 GCC 版本)
          TOOLCHAIN_DIR=$(find "$SDK_DIR/staging_dir" -maxdepth 1 -type d -name "toolchain-*" | head -1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "ERROR: Toolchain directory not found!"
            ls -la "$SDK_DIR/staging_dir/"
            exit 1
          fi
          echo "Toolchain: $TOOLCHAIN_DIR"

          # 定位目标库目录 (SDK 可能不包含此目录)
          TARGET_DIR=$(find "$SDK_DIR/staging_dir" -maxdepth 1 -type d -name "target-*" | head -1)
          echo "Target dir: ${TARGET_DIR:-<none>}"

          # 导出环境变量到后续步骤
          echo "STAGING_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          echo "TARGET_DIR=${TARGET_DIR}"   >> $GITHUB_ENV

          # 将工具链 bin 目录添加到 PATH
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

          # 配置 pkg-config 交叉编译搜索路径
          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR/usr/lib/pkgconfig" ]; then
            echo "PKG_CONFIG_PATH=$TARGET_DIR/usr/lib/pkgconfig"    >> $GITHUB_ENV
            echo "PKG_CONFIG_LIBDIR=$TARGET_DIR/usr/lib/pkgconfig"  >> $GITHUB_ENV
            echo "PKG_CONFIG_SYSROOT_DIR=$TARGET_DIR"               >> $GITHUB_ENV
          fi

          # 验证交叉编译器可用 (mt7981 使用 aarch64-openwrt-linux-musl- 前缀)
          echo "=== Cross-compiler version ==="
          aarch64-openwrt-linux-musl-gcc --version
          echo "=== Cross-compiler ready ==="

      # ======================================================================
      # 步骤 5: 获取 FFmpeg 源代码
      # ======================================================================
      - name: Checkout FFmpeg source
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: ${{ env.FFMPEG_VERSION }}
          path: ffmpeg-src
          fetch-depth: 1

      # ======================================================================
      # 步骤 6: 配置 FFmpeg (交叉编译选项 - 针对 mt7981 / Cortex-A53)
      # ======================================================================
      - name: Configure FFmpeg
        working-directory: ffmpeg-src
        run: |
          set -e

          # 组装 configure 参数
          CONFIG_FLAGS=(
            # 交叉编译核心选项
            --enable-cross-compile
            --cross-prefix=aarch64-openwrt-linux-musl-
            --arch=aarch64
            --cpu=${CPU}
            --target-os=linux
            --prefix=/usr
            --pkg-config=pkg-config

            # 线程与压缩支持
            --enable-pthreads
            --enable-zlib

            # 禁用不需要的功能 (减小体积)
            --disable-doc
            --disable-debug
            --disable-lzma
            --disable-vaapi
            --disable-vdpau
            --disable-outdevs
            --disable-ffplay
            --disable-runtime-cpudetect
            --disable-x86asm

            # 启用 ARM NEON 与 VFP 硬件浮点 (Cortex-A53 支持)
            --enable-neon
            --enable-vfp
          )

          # 构建类型: 静态 / 动态
          if [ "$BUILD_TYPE" = "static" ]; then
            CONFIG_FLAGS+=(--enable-static --disable-shared --pkg-config-flags=--static)
          else
            CONFIG_FLAGS+=(--enable-shared --disable-static)
          fi

          # GPL 编解码器
          if [ "$ENABLE_GPL" = "true" ]; then
            CONFIG_FLAGS+=(--enable-gpl --enable-version3)
          fi

          # 体积优化
          if [ "$OPTIMIZE_SIZE" = "true" ]; then
            CONFIG_FLAGS+=(--enable-small --enable-hardcoded-tables --enable-lto)
          fi

          # 额外编译/链接标志 (针对 Cortex-A53 优化)
          EXTRA_CFLAGS="-O2 -mcpu=${CPU} -mtune=${CPU}"
          EXTRA_LDFLAGS=""
          if [ -n "$TARGET_DIR" ]; then
            EXTRA_CFLAGS="$EXTRA_CFLAGS -I$TARGET_DIR/usr/include"
            EXTRA_LDFLAGS="-L$TARGET_DIR/usr/lib"
          fi
          CONFIG_FLAGS+=(--extra-cflags="$EXTRA_CFLAGS")
          CONFIG_FLAGS+=(--extra-ldflags="$EXTRA_LDFLAGS")
          CONFIG_FLAGS+=(--extra-libs="-lpthread -lm -lz")

          echo "=== Running ./configure ==="
          ./configure "${CONFIG_FLAGS[@]}"

          echo ""
          echo "=== Configuration summary ==="
          grep -E "^(install prefix|C compiler|arch|cpu|big endian|runtime cpudetect|NEON)" ffbuild/config.log 2>/dev/null || true

      # ======================================================================
      # 步骤 7: 编译 FFmpeg
      # ======================================================================
      - name: Build FFmpeg
        working-directory: ffmpeg-src
        run: |
          set -e
          make -j"$(nproc)"
          echo "=== Build complete ==="

      # ======================================================================
      # 步骤 8: 安装到临时目录
      # ======================================================================
      - name: Install FFmpeg
        working-directory: ffmpeg-src
        run: |
          set -e
          make install DESTDIR="$GITHUB_WORKSPACE/ffmpeg-install"

          echo "=== Installed files ==="
          find "$GITHUB_WORKSPACE/ffmpeg-install" -type f | sort

      # ======================================================================
      # 步骤 9: Strip 二进制文件 (减小体积)
      # ======================================================================
      - name: Strip binaries
        run: |
          BIN_DIR="ffmpeg-install/usr/bin"
          STRIP=$(find openwrt-sdk/staging_dir -name "aarch64-openwrt-linux-musl-strip" | head -1)

          if [ -z "$STRIP" ]; then
            echo "WARNING: cross-strip not found, skipping strip"
            exit 0
          fi

          for bin in "$BIN_DIR"/ffmpeg "$BIN_DIR"/ffprobe; do
            if [ -f "$bin" ]; then
              echo "Stripping: $bin"
              echo "  before: $(du -h "$bin" | cut -f1)"
              "$STRIP" --strip-all "$bin"
              echo "  after:  $(du -h "$bin" | cut -f1)"
            fi
          done

      # ======================================================================
      # 步骤 10: 验证二进制架构 (确认 aarch64 / Cortex-A53)
      # ======================================================================
      - name: Verify binary architecture
        run: |
          echo "=== Binary verification ==="
          for bin in ffmpeg-install/usr/bin/ffmpeg ffmpeg-install/usr/bin/ffprobe; do
            if [ -f "$bin" ]; then
              echo "--- $bin ---"
              file "$bin"
              readelf -h "$bin" | grep -E "Class|Machine|Flags"
              echo "Size: $(du -h "$bin" | cut -f1)"
              echo ""
            fi
          done

      # ======================================================================
      # 步骤 11: 打包编译产物
      # ======================================================================
      - name: Package artifacts
        run: |
          PKG_NAME="ffmpeg-${FFMPEG_VERSION}-openwrt-mt7981-${ARCH}-${BUILD_TYPE}"

          mkdir -p artifacts

          # 主包: tar.gz
          cd ffmpeg-install
          tar -czf "$GITHUB_WORKSPACE/artifacts/${PKG_NAME}.tar.gz" .
          cd ..

          # 文件清单
          find ffmpeg-install -type f | sed 's|ffmpeg-install/||' | sort > artifacts/file-list.txt

          # 构建信息
          {
            echo "FFmpeg version: ${FFMPEG_VERSION}"
            echo "OpenWrt version: ${OPENWRT_VERSION}"
            echo "Target: ${TARGET}/${SUBTARGET} (mt7981)"
            echo "Architecture: ${ARCH}"
            echo "CPU: ${CPU}"
            echo "GCC: ${GCC_VERSION}"
            echo "Build type: ${BUILD_TYPE}"
            echo "Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Runner: $(uname -a)"
          } > artifacts/build-info.txt

          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

          echo "=== Artifacts ==="
          ls -lh artifacts/

      # ======================================================================
      # 步骤 12: 上传编译产物
      # ======================================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: artifacts/
          retention-days: 30
          compression-level: 0

      # ======================================================================
      # 步骤 13: 构建摘要
      # ======================================================================
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| FFmpeg | ${FFMPEG_VERSION} |"
            echo "| OpenWrt | ${OPENWRT_VERSION} |"
            echo "| Target | ${TARGET}/${SUBTARGET} (mt7981) |"
            echo "| Architecture | ${ARCH} |"
            echo "| CPU | ${CPU} |"
            echo "| GCC | ${GCC_VERSION} |"
            echo "| Build type | ${BUILD_TYPE} |"
            echo "| GPL | ${ENABLE_GPL} |"
            echo "| Size optimized | ${OPTIMIZE_SIZE} |"
            echo ""
            echo "### Binary sizes"
            echo '```'
            ls -lh ffmpeg-install/usr/bin/ 2>/dev/null || echo "(not available)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
